<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>애니메이션 오픈 일정</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --page:#F1F2EE; --surface:#FFFFFF; --ink:#16191D; --ink2:#474C53; --muted:#868B91;
  --line:#E1E3DD; --line2:#C9CCC5;
  --launch:#1E48C8; --serial:#D7E0FA; --serial-ink:#1E3A8A; --prod:#E7E8E2;
  --warn:#B97C06; --warn-bg:#FCEFCF; --bad:#C4362E; --bad-bg:#FBE2DF; --good:#1F7A50; --good-bg:#DDF0E5;
  --ai:#5B45D6; --ai-bg:#E9E5FB; --now:#F2C230;
  /* 제작 라인: 내부 = 하늘색, 외부 = 주황 (같은 명도·채도 톤) */
  --int:#2B8FCC; --int-bg:#D6ECF8; --int-ink:#135B85; --int-prod:#E6F2F9;
  /* 휴재: 벽돌 붉은색 */
  --hia:#A8432C; --hia-bg:#E9C1B4; --hia-ink:#6E2718;
  --ext:#E07A2E; --ext-bg:#FBE3CF; --ext-ink:#8E4616; --ext-prod:#FBEEE3;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-size:14px;line-height:1.5;
  font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--launch);outline-offset:1px}
[hidden]{display:none!important}

/* 상단 */
.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
.top-in{max-width:1680px;margin:0 auto;padding:12px 20px 0;display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 24px}
.brand{padding-bottom:10px}
.brand h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.02em}
.brand p{margin:0;font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:2px;margin-right:auto}
.tabs button{border:0;background:none;padding:10px 14px 11px;font-size:14px;font-weight:600;color:var(--muted);
  cursor:pointer;border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.sync{font-size:12px;padding:4px 10px;border-radius:6px;margin-bottom:10px;background:var(--page);color:var(--ink2)}
.sync[data-s="on"]{background:var(--good-bg);color:var(--good)}
.sync[data-s="off"],.sync[data-s="busy"]{background:var(--warn-bg);color:var(--warn)}
.sync[data-s="err"]{background:var(--bad-bg);color:var(--bad)}

main{max-width:1680px;margin:0 auto;padding:20px 20px 80px}
h2{font-size:15px;font-weight:700;margin:28px 0 10px;letter-spacing:-.01em}
h2:first-child{margin-top:4px}
.hint{font-size:12px;color:var(--muted)}
.btn{border:1px solid var(--line2);background:var(--surface);border-radius:7px;padding:6px 12px;font-size:13px;cursor:pointer}
.btn:hover{border-color:var(--ink2)}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.danger{color:var(--bad)}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:5px;white-space:nowrap}
.tag.good{background:var(--good-bg);color:var(--good)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.bad{background:var(--bad-bg);color:var(--bad)}
.vo{font-size:11px;font-weight:600;padding:0 6px;border-radius:4px}
.vo.human{background:var(--good-bg);color:var(--good)}
.vo.ai{background:var(--ai-bg);color:var(--ai)}

/* ── 오픈 일정 (리더용) ── */
.lead{font-size:20px;font-weight:600;letter-spacing:-.02em;margin:0 0 4px;line-height:1.4}
.lead-sub{font-size:13px;color:var(--ink2);margin:0}
.strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.mon{flex:none;min-width:190px;max-width:260px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.mon .ml{font-size:12px;color:var(--muted)}
.mon .mn{font-size:34px;font-weight:700;line-height:1.1;letter-spacing:-.03em;color:var(--launch)}
.mon .mn small{font-size:14px;font-weight:600;color:var(--ink2);margin-left:4px;letter-spacing:0}
.mon ul{list-style:none;margin:8px 0 0;padding:0;font-size:12.5px}
.mon li{display:flex;justify-content:space-between;gap:8px;padding:2px 0;border-top:1px solid var(--line)}
.mon li span:last-child{color:var(--muted)}
.mon li.late span:last-child{color:var(--bad);font-weight:600}

.calwrap{overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;max-height:78vh}
table.cal{border-collapse:separate;border-spacing:0;font-size:12px}
table.cal th,table.cal td{padding:0}
table.cal thead th{position:sticky;top:0;z-index:5;background:var(--surface)}
table.cal thead tr:nth-child(2) th{top:24px}
.cal .yr{height:24px;font-size:12px;font-weight:700;text-align:left;padding-left:8px;border-bottom:1px solid var(--line);border-left:1px solid var(--line2)}
.cal .mh{height:26px;width:62px;min-width:62px;font-weight:500;color:var(--muted);border-bottom:1px solid var(--line2);border-left:1px solid var(--line)}
.cal .mh.now{color:var(--ink);font-weight:700;box-shadow:inset 0 -3px 0 var(--now)}
.cal .rl{position:sticky;left:0;z-index:4;background:var(--surface);min-width:230px;max-width:230px;text-align:left;
  padding:6px 10px;border-bottom:1px solid var(--line);border-right:1px solid var(--line2);font-weight:400}
thead .rl{z-index:7}
.cal .rl .nm{border:0;background:none;padding:0;font-weight:700;font-size:13px;cursor:pointer;text-align:left;
  display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal .rl .nm:hover{text-decoration:underline}
.cal .rl .mt{display:flex;gap:6px;align-items:center;margin-top:2px;font-size:11.5px;color:var(--muted)}
.cal td.c{height:44px;border-bottom:1px solid var(--line);border-left:1px solid var(--line);text-align:center;vertical-align:middle;position:relative}
.cal td.c.now{box-shadow:inset 1px 0 0 var(--now),inset -1px 0 0 var(--now)}
.cal td.prod{background:repeating-linear-gradient(135deg,var(--lp,var(--prod)) 0 5px,#F7F7F4 5px 10px)}
tr.ln-int{--lc:var(--int);--ls:var(--int-bg);--li:var(--int-ink);--lp:var(--int-prod)}
tr.ln-ext{--lc:var(--ext);--ls:var(--ext-bg);--li:var(--ext-ink);--lp:var(--ext-prod)}
tr.ln-int .rl,tr.ln-ext .rl{box-shadow:inset 4px 0 0 var(--lc)}
.ln{display:inline-block;font-size:10.5px;font-weight:700;padding:0 5px;border-radius:4px;white-space:nowrap}
.ln.int{background:var(--int-bg);color:var(--int-ink)}
.ln.ext{background:var(--ext-bg);color:var(--ext-ink)}
.lnd{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;flex:none;vertical-align:0}
.lnd.int{background:var(--int)} .lnd.ext{background:var(--ext)}
.cal td.serial{background:var(--ls,var(--serial));color:var(--li,var(--serial-ink));font-weight:600}
.cal td.launch{background:var(--lc,var(--launch));color:#fff;font-weight:700;line-height:1.15}
.cal td.launch small,.cal td.serial small,.cal td.end small{display:block;font-size:10.5px;font-weight:500;opacity:.85}
.cal td.end{background:var(--ls,var(--serial));color:var(--li,var(--serial-ink));font-weight:700}
.cal tr.sum td.c{height:34px;font-size:15px;font-weight:700;background:var(--surface)}
.cal tr.sum td.c.z{color:var(--line2);font-weight:400;font-size:12px}
.cal tr.sum .rl{font-size:12px;color:var(--ink2);font-weight:600}
.cal tr.sum.first td,.cal tr.sum.first th{border-top:0}
.cal tr.sum.last td,.cal tr.sum.last th{border-bottom:1px solid var(--line2)}
.cal tr.sum td.hot{color:var(--launch)}
.calwrap.fit{overflow-x:auto}
table.cal.fit{width:100%;min-width:1880px;table-layout:fixed}
table.cal.fit col.rlc{width:224px}
.cal .rl .mt{white-space:nowrap}
.cal .rl .mt .vo{flex:none}
table.cal.fit .rl{min-width:0;max-width:none}
table.cal.fit .mh{width:auto;min-width:0;font-size:11.5px}
table.cal.fit td.launch{font-size:12px}
.cal .y1{border-left:2px solid var(--line2)!important}
.cal td.gap{box-shadow:inset 0 -4px 0 var(--hia)}
.cal td.gaponly{background:var(--hia-bg);color:var(--hia-ink);font-weight:700;font-size:11px}
table.std.cmp{max-width:none;background:var(--surface)}
table.std.cmp td{white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:var(--surface);flex-wrap:wrap}
.seg button{border:0;border-left:1px solid var(--line2);background:none;padding:7px 12px;font-size:13px;cursor:pointer;color:var(--ink2)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff;font-weight:600}
.cal tr.sum td.low{background:var(--bad-bg);color:var(--bad)!important}
.staff .sh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;font-weight:600}
.staff ol{list-style:none;margin:10px 0 0;padding:0;font-size:13px}
.staff li{display:grid;grid-template-columns:24px minmax(120px,170px) 1fr auto;grid-template-areas:"rk nm st mv" ". nt nt nt";gap:2px 10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.staff li .rk{grid-area:rk} .staff li b{grid-area:nm} .staff li .st{grid-area:st} .staff li .mv{grid-area:mv;display:flex;gap:4px} .staff li .hint{grid-area:nt;font-size:11.5px}
.staff li.off{color:var(--muted)}
.staff li.off b{color:var(--ink2)}
.staff .rk{width:20px;height:20px;border-radius:50%;background:var(--page);font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.staff li.on .rk{background:var(--int);color:#fff}
.staff .q:disabled{opacity:.3;cursor:default}
.tag.tbd{background:var(--warn-bg);color:var(--warn)}
.tag.pzt{background:#E4E5E1;color:var(--ink2)}
.cal td.pz{background:repeating-linear-gradient(135deg,#E1E2DD 0 4px,#EEEFEB 4px 8px);color:var(--ink2);font-size:11px;font-weight:700}
.pzbar{margin:14px 0 0;padding:9px 12px;border-radius:8px;background:#ECEDE9;border-left:4px solid var(--ink2);font-size:13px}
td.pzc{box-shadow:inset 0 3px 0 var(--ink2)}
.pzl{display:block;font-size:10px;font-weight:700;color:var(--ink2);padding:4px 22px 0 7px;white-space:nowrap}
.cal .far{color:var(--ink2);font-weight:700;font-size:14px}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12px;color:var(--ink2);margin:10px 0 0}
.legend i{display:inline-block;width:18px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:6px}

/* ── 제작 일정 ── */
.prodlay{display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px;align-items:start}
.wlist{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px;position:sticky;top:76px}
.wlist button.wi{display:block;width:100%;text-align:left;border:0;background:none;border-radius:7px;padding:8px 10px;cursor:pointer}
.wlist button.wi:hover{background:var(--page)}
.wlist button.wi[aria-current="true"]{background:var(--ink);color:#fff}
.wlist button.wi[aria-current="true"] .ws{color:#C9CCD1}
.wi b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wi .ws{display:flex;gap:6px;align-items:center;font-size:11.5px;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}
.dot.good{background:var(--good)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}
.wlist .add{width:100%;margin-top:6px}

.whead{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.wtitle{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.wtitle input{font-size:19px;font-weight:700;letter-spacing:-.02em;border:1px solid transparent;border-radius:6px;padding:2px 6px;margin-left:-6px;background:none;min-width:0;width:auto}
.wtitle input:hover{border-color:var(--line)}
.wtitle .sp{flex:1}
.fgrid{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;margin-top:12px;align-items:start}
.fgrid .gl{font-size:12px;font-weight:700;color:var(--ink2);padding-top:18px}
.fields{display:flex;flex-wrap:wrap;gap:10px 14px}
.fields label{display:flex;flex-direction:column;font-size:11.5px;color:var(--muted);gap:3px}
.in{border:1px solid var(--line2);border-radius:6px;padding:4px 7px;font-size:13px;background:var(--surface);min-height:30px}
.in.n{width:72px;text-align:right}
.in.t{width:140px}
.stats{display:flex;flex-wrap:wrap;gap:8px 28px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.stat .sl{font-size:11.5px;color:var(--muted)}
.stat .sv{font-size:17px;font-weight:700;letter-spacing:-.01em}
.stat .sv small{font-size:12px;font-weight:600;margin-left:6px}

.gtools{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin:16px 0 8px}
.gtools .legend{margin:0}
.gridwrap{overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;max-height:74vh}
table.eg{border-collapse:separate;border-spacing:0;font-size:12px}
table.eg th,table.eg td{padding:0}
table.eg thead th{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line2);
  vertical-align:bottom;text-align:left;padding:8px 6px 6px;font-weight:600;font-size:11.5px;line-height:1.3;border-left:1px solid var(--line)}
table.eg thead th small{display:block;font-weight:400;color:var(--muted);font-size:10.5px}
table.eg thead th.ep,table.eg td.ep{position:sticky;left:0;z-index:4;background:var(--surface);min-width:54px;text-align:center;border-left:0;border-right:1px solid var(--line2)}
table.eg thead th.ep{z-index:7}
table.eg thead th.rd,table.eg thead th.op{background:#F7F8F5}
table.eg td{border-bottom:1px solid var(--line);border-left:1px solid var(--line)}
table.eg td.ep{font-weight:700;font-size:12.5px}
table.eg tr.k td.ep{box-shadow:inset 3px 0 0 var(--launch)}
.cl{display:block;width:100%;min-width:74px;border:0;background:none;padding:5px 7px;text-align:left;cursor:pointer;line-height:1.25}
.cl:hover{background:var(--page)}
.cl .dt{display:block;font-weight:600;font-size:12.5px}
.cl .dt small{font-weight:500;color:var(--muted);font-size:10px;margin-right:1px}
.cl .du{display:block;font-size:10.5px;color:var(--muted)}
.cl .du .mm{white-space:nowrap;font-style:normal;font-size:9.5px;font-weight:700;color:var(--ink2);background:var(--page);border-radius:3px;padding:0 3px}
.cl .du em{font-style:normal;color:var(--bad);font-weight:700}
.cl.past .dt{color:var(--muted)}
.cl.done .dt{color:var(--good)}
.cl.dur{box-shadow:inset 0 0 0 1.5px var(--warn)}
.cl.fix{box-shadow:inset 0 0 0 1.5px var(--ink)}
.cl.fix .dt::before{content:"◆ ";font-size:9px;vertical-align:1px}
table.eg td{position:relative}
.ck{position:absolute;top:4px;right:4px;z-index:2;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line2);background:var(--surface);
  padding:0;font-size:10px;font-weight:700;line-height:13px;color:#fff;cursor:pointer}
.ck:hover{border-color:var(--good);box-shadow:0 0 0 3px var(--good-bg)}
.ck.on{background:var(--good);border-color:var(--good)}
td.bt .ck{top:6px}
.cl.ok{background:var(--good-bg)}
.cl.ok .dt{color:var(--good)}
.cl.ok .dt::before{content:"✓ ";font-size:10px}
.cl.ok .du{color:var(--good);font-weight:600}
.cl.over{box-shadow:inset 3px 0 0 var(--bad)}
td.na{background:repeating-linear-gradient(135deg,#FAFAF7 0 5px,#F3F4F0 5px 10px);color:var(--line2);text-align:center;font-size:12px}
table.eg thead .upto{font-size:10px;font-weight:700;color:var(--launch);background:var(--serial);border-radius:3px;padding:0 4px;white-space:nowrap}
.cl .ovd{font-weight:700;color:var(--bad);font-size:9.5px;white-space:nowrap}
.cl{padding-right:22px}
td.rdc{background:#F7F8F5;padding:5px 8px;font-weight:600;min-width:64px}
td.opc{background:#F7F8F5}
.cl.open .dt{font-size:13px}
.badge{display:inline-block;font-size:10px;font-weight:700;padding:0 5px;border-radius:4px;margin-left:4px;vertical-align:1px}
.badge.l{background:var(--launch);color:#fff}
.badge.g{background:var(--hia-bg);color:var(--hia-ink)}
.badge.x{background:var(--bad-bg);color:var(--bad)}
.more{margin:8px 0 0}

td.bt{vertical-align:middle;background:#FAFAF6}
td.bt .cl{height:100%}
td.bt.wk{vertical-align:top}
td.bt.wk .cl{position:sticky;top:48px;min-width:96px;max-width:130px}
.cl .wm{display:block;margin-top:6px;font-size:10.5px;line-height:1.35;color:var(--ink2);white-space:normal;word-break:keep-all}
.cl .bl{display:block;font-size:10px;color:var(--ink2);font-weight:600;margin-bottom:2px}
th.dubh{background:#F4F3EC!important}
td.opc .ov{padding:5px 8px 0;font-weight:700;font-size:13px;white-space:nowrap}
td.opc .du{padding:0 8px 5px;font-size:10.5px;color:var(--muted);white-space:nowrap}
td.opc.crit{box-shadow:inset 0 0 0 1.5px var(--bad)}
.badge.c{background:var(--bad-bg);color:var(--bad)}
textarea.hol{width:100%;max-width:520px;min-height:260px;font:12.5px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;border:1px solid var(--line2);border-radius:8px;padding:8px 10px}
.rules{display:flex;flex-wrap:wrap;gap:8px 28px;font-size:13px}
.rules b{font-size:16px}
/* 팝오버 */
.pop{position:absolute;z-index:60;width:340px;background:var(--surface);border:1px solid var(--line2);border-radius:10px;
  box-shadow:0 10px 30px rgba(20,24,30,.16);padding:14px}
.pop h4{margin:0;font-size:14px}
.pop .ps{font-size:12px;color:var(--muted);margin:1px 0 12px}
.pop .row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.pop .row>span{font-size:12px;color:var(--ink2);width:78px}
.pop .q{border:1px solid var(--line2);background:var(--surface);border-radius:6px;padding:3px 8px;font-size:12px;cursor:pointer}
.pop .q:hover{border-color:var(--ink2)}
.pop .note{font-size:11.5px;color:var(--muted);margin:-4px 0 10px 84px;line-height:1.4}
.pop .chk{font-size:12px;color:var(--ink2);display:flex;gap:6px;align-items:center;margin:0 0 12px 84px}
.pop .acts{display:flex;gap:6px;justify-content:flex-end;border-top:1px solid var(--line);padding-top:10px}

/* ── 공정 기준 ── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
table.std{border-collapse:collapse;width:100%;max-width:1100px;font-size:13px}
table.std td,table.std th{white-space:nowrap}
table.std th,table.std td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
table.std th{font-size:11.5px;color:var(--muted);font-weight:600}
table.std td.r,table.std th.r{text-align:right}
table.std tfoot td{font-weight:700;border-bottom:0;border-top:2px solid var(--line2)}
.sql{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;background:var(--page);border-radius:8px;padding:10px 12px;white-space:pre;overflow:auto;margin:8px 0 0}

@media (max-width:900px){
  .prodlay{grid-template-columns:1fr}
  .wlist{position:static;display:flex;overflow-x:auto;gap:4px}
  .wlist button.wi{width:auto;min-width:140px}
  .wlist .add{width:auto;margin:0}
  .fgrid{grid-template-columns:1fr}
  .fgrid .gl{padding-top:0}
  .cal .rl{min-width:150px;max-width:150px}
}
</style>
</head>
<body>

<header class="top"><div class="top-in">
  <div class="brand"><h1>애니메이션 오픈 일정</h1><p id="today"></p></div>

  const ps=[];

    for(let k=1;k<=t.eps;k++) Object.entries(B1_TIMELINE.perEp).forEach(([sk,o])=>ps.push({p:["ov",`${k}:${sk}`],v:clone(o)}));
    Object.entries(B1_TIMELINE.batch).forEach(([sk,o])=>ps.push({p:["ov",`1:${sk}`],v:clone(o)}));
    Object.entries(B1_TIMELINE.work).forEach(([sk,o])=>ps.push({p:["ov",`w:${sk}`],v:clone(o)}));

    if(isW){ const kk=`w:${sk}`, cur=ps.filter(p=>p.p[1]===kk&&!p.del).pop();

  });
  return ps;
}

const normW=(w)=>(w=>({...w,voice:"human"}))({n:"새 작품",owner:"",voice:"human",done:0,rate:7,start:key(TODAY),b1:BATCH,total:20,

let WORKS=[], CONF=normConf(DEFAULT_CONF);

let TAB="open", SEL=null, SHOWALL=false;

/* ---------- 일정 계산 ----------
   · 모든 제작 날짜는 영업일(주말·한국 공휴일 제외)로 계산
   · 각 단계는 앞선 단계가 모두 끝난 다음 영업일에 시작 (완료일을 지정한 병행 작업 포함)
   · 회차별: 회차마다 진행. '회차 순차'면 앞 회차의 같은 단계가 끝나야 시작

   · 작품 1회: 1화가 이 단계에 도착하면 한 번 진행.
       - '다음 단계 전': 모든 회차의 다음 단계가 이 완료를 기다림 (예: 성우 캐스팅 → 더빙)
       - '런칭 전': 제작은 계속 진행, 런칭만 이 완료 뒤로 (예: 계약 체결)
   · 오픈: 런칭일에 3회차 동시 오픈, 이후 주 1회. 전 회차가 휴재 없이 이어지는

const teamOf=(s,w)=>(w&&w.team&&w.team[s.k])||s.team;
const durOf=(s,w)=>s.k==="prod1"?Math.max(1,+w.rate||s.h):+s.h;   // 성우: 전 작품 인간 성우 고정
const stagesFor=(w)=>CONF.stages.filter(s=>s.k==="prod1"||durOf(s,w)>0);
function batchesOf(w,N){
  const out=[]; let a=1, size=clamp(+w.b1||BATCH,1,N);
  while(a<=N){ const b=Math.min(N,a+size-1); out.push([a,b]); a=b+1; size=BATCH; }
  return out;
}
const fixD=(f)=>snapBD(D(f));   // 지정 날짜가 휴일이면 다음 영업일로
const ovKey=(c,s,k)=>c&&c.work?`w:${s.k}`:c&&c.batch?`${c.batch[0]}:${s.k}`:`${k}:${s.k}`;

function schedule(w,useOv=true){
  const ov=useOv?(w.ov||{}):{};
  const ST=stagesFor(w), N=clamp(+w.total||1,1,300), done=clamp(+w.done||0,0,N);
  const start0=snapBD(D(w.start||key(TODAY))), doneEnd=prevBD(start0);
  const BT=batchesOf(w,N), bOf=[null];
  BT.forEach(([a,b],i)=>{for(let k=a;k<=b;k++) bOf[k]=i;});
  const eps=[null]; for(let k=1;k<=N;k++) eps.push({cells:{}});
  const prev=Array(N+1).fill(null);
  const gates=[];   // 런칭 전 완료 조건
  const bump=(k,e)=>{ if(!prev[k]||e>prev[k]) prev[k]=e; };
  const mkKind=(o)=>o?(o.ok?"ok":o.f?"fix":(o.d!=null?"dur":"")):"";   // ok = 담당자가 완료 처리
  const durO=(o,base)=>o&&o.d!=null?Math.max(0,+o.d):base;

  const PAR_JOIN="burn";                       // 병행 단계는 '자막 최종 영상본' 전에 합류
  const parEnds=Array(N+1).fill(null);
  const lastMain=Array(N+1).fill(null);   // 직전 '본 단계' 시작일 — 동시 시작(conc) 단계가 씀
  const markMain=(s,k,c)=>{ if(!s.par&&!s.conc) lastMain[k]=c.s||c.e; };
  ST.forEach(s=>{
    const base=durOf(s,w);
    if(s.k===PAR_JOIN) for(let k=1;k<=N;k++) if(parEnds[k]) bump(k,parEnds[k]);
    if(s.k==="prod1"){
      for(let k=1;k<=N;k++){
        const o=ov[`${k}:prod1`]||null;
        if(k<=done){ const e=o&&o.f?fixD(o.f):doneEnd;
          eps[k].cells.prod1={e,d:base,base,done:true,kind:o&&o.f?"fix":"",m:o&&o.m||""}; bump(k,e); markMain(s,k,eps[k].cells.prod1); continue; }
        let d=durO(o,base);
        let st=(k<=done+1||!s.seq)?start0:nextBD(eps[k-1].cells.prod1.e);
        if(prev[k]&&nextBD(prev[k])>st) st=nextBD(prev[k]);
        let e=d>0?addBD(st,d-1):prevBD(st);
        if(o&&o.f){ e=fixD(o.f); if(e<st) st=null; else d=bdDiff(st,e)+1; }
        eps[k].cells.prod1={s:st,e,d,base,kind:mkKind(o),m:o&&o.m||""}; bump(k,e); markMain(s,k,eps[k].cells.prod1);
      }
      return;
    }
    if(s.sc==="work"){
      const o=ov[`w:${s.k}`]||null; let d=durO(o,base);
      if(s.gate==="none"||s.k==="contract"){   // 마감형: 제작 시작 N영업일 전까지 완료 — 일정에는 영향 없음
        const e=o&&o.f?fixD(o.f):subBD(start0,base);
        const cell={s:null,e,d:base,base,kind:mkKind(o),m:o&&o.m||"",work:true,gate:"none",due:true};
        for(let k=1;k<=N;k++) eps[k].cells[s.k]=cell; return;
      }
      let st=s.conc?(lastMain[1]||start0):(prev[1]?nextBD(prev[1]):start0);
      let e=d>0?addBD(st,d-1):prevBD(st);
      if(o&&o.f){ e=fixD(o.f); if(e<st) st=null; else d=bdDiff(st,e)+1; }
      const cell={s:st,e,d,base,kind:mkKind(o),m:o&&o.m||"",work:true,gate:s.gate||"next"};
      for(let k=1;k<=N;k++){ eps[k].cells[s.k]=cell; if(cell.gate!=="open") bump(k,e); }
      if(cell.gate==="open") gates.push({s,e,need:addBD(e,+CONF.lockBD||0)});
      return;
    }
    if(s.sc==="batch"){
      let prevB=null;
      BT.forEach(([a,b])=>{
        const o=ov[`${a}:${s.k}`]||null; let d=durO(o,base);
        let st=null; for(let k=a;k<=b;k++){const x=s.conc?(lastMain[k]||start0):(prev[k]?nextBD(prev[k]):start0); if(!st||x>st) st=x;}
        if(s.seq&&prevB){const x=nextBD(prevB); if(x>st) st=x;}
        let e=d>0?addBD(st,d-1):prevBD(st);
        if(o&&o.f){ e=fixD(o.f); if(e<st) st=null; else d=bdDiff(st,e)+1; }
        for(let k=a;k<=b;k++){ eps[k].cells[s.k]={s:st,e,d,base,kind:mkKind(o),m:o&&o.m||"",batch:[a,b]}; bump(k,e); markMain(s,k,eps[k].cells[s.k]); }
        prevB=e;
      });
      return;
    }
    for(let k=1;k<=N;k++){
      if(s.upto>0&&k>s.upto){ eps[k].cells[s.k]={skip:true,e:prev[k]}; continue; }   // 예: 승인은 1~3화만
      const o=ov[`${k}:${s.k}`]||null; let d=durO(o,base);
      let st=s.conc?(lastMain[k]||start0):(prev[k]?nextBD(prev[k]):start0);
      if(s.seq&&k>1&&!eps[k-1].cells[s.k].skip){const x=nextBD(eps[k-1].cells[s.k].e); if(x>st) st=x;}
      let e=d>0?addBD(st,d-1):(prev[k]||prevBD(st));
      if(o&&o.f){ e=fixD(o.f); if(e<st) st=null; else d=bdDiff(st,e)+1; }   // 앞 단계와 병행해 먼저 끝난 경우
      eps[k].cells[s.k]={s:st,e,d,base,kind:mkKind(o),m:o&&o.m||"",par:!!s.par};
      if(s.par){ if(!parEnds[k]||e>parEnds[k]) parEnds[k]=e; }   // 다음 단계를 막지 않음
      else{ bump(k,e); markMain(s,k,eps[k].cells[s.k]); }
    }
  });
  for(let k=1;k<=N;k++){ eps[k].ready=prev[k]; eps[k].need=addBD(prev[k],+CONF.lockBD||0); }

  /* 휴재 없는 최단 런칭: open_k = L + 7·max(0,k-3) 이 모든 회차에서 need_k 이상 + 런칭 전 조건 */
  const K=Math.min(OPEN_K,N), T=D(w.launch||"2026-12-21");
  let L=T;
  for(let g=0;g<520;g++){
    let bad=false;
    for(let k=1;k<=N;k++){ if(eps[k].need>addDays(L,CAD_D*Math.max(0,k-K))){bad=true;break;} }
    if(!bad) break; L=addDays(L,7);
  }
  const Lep=L; let critGate=null;
  gates.forEach(g=>{ while(g.need>L) L=addDays(L,7); });
  if(L>Lep) critGate=gates.reduce((a,g)=>!a||g.e>a.e?g:a,null);
  let crit=1, minSlack=Infinity;
  for(let k=1;k<=N;k++){
    const E=eps[k]; E.open=addDays(L,CAD_D*Math.max(0,k-K));
    E.slack=bdDiff(E.need,E.open);
    if(E.slack<minSlack){minSlack=E.slack;crit=k;}
  }
  return {eps,N,K,L,T,delayW:weeks(T,L),crit,critGate,end:eps[N].open,start0,done,ST,BT,bOf};
}

   · 모든 작품은 휴재 없는 최단 런칭일(lmin) 이후 아무 월요일에나 런칭 가능 (늦출수록 여유만 늘어남)

                           ③ 둘 다 안 되면 '불가 구간'으로 남김                                   */
const MIN_ON_AIR=2;
const PLAN_END="2028-12-25";            // 편성 기간 끝 (월간표 마지막 월요일)
const NEW_RATE=13;                      // 신규 프로젝트 회차당 1차 제작(영업일) — 기존 내부·외부 후보와 동일
const monOnOrAfter=(d)=>{let x=d;while(x.getUTCDay()!==1)x=addDays(x,1);return x;};
const lminOf=(w)=>schedule({...w,launch:"2026-01-05"}).L;       // 목표일 제약 없이 가장 이른 런칭
const serialDays=(w)=>{const N=clamp(+w.total||1,1,300);return CAD_D*Math.max(0,N-Math.min(OPEN_K,N));};
function onAirCount(items,t){ let n=0; for(const i of items) if(i.L<=t&&t<=addDays(i.L,i.dur)) n++; return n; }
function coverageGaps(items,from,to){
  const out=[]; for(let t=from;t<=to;t=addDays(t,7)){ const n=onAirCount(items,t); if(n<MIN_ON_AIR) out.push({t,n}); } return out;
}
function newProject(kind,idx,start,launch){
  const ext=kind==="ext", id=(ext?"x":"i")+idx+"-"+key(start).replace(/-/g,"");
  const ym=`${String(start.getUTCFullYear()).slice(2)}년 ${start.getUTCMonth()+1}월`;
  const w=normW({id,n:`${ext?"외부":"내부"} 제작 ${idx} (${ym})`,owner:ext?"외부 제작사":"내부 제작팀",
    done:0,rate:NEW_RATE,start:key(start),b1:BATCH,total:20,launch:key(launch),auto:true});
  if(ext) w.team={prod1:"외부 제작사",prodF:"외부 제작사"};
  return w;
}
function planCoverage(){
  // 이전 자동 편성은 되돌리고 처음부터 다시: 자동 추가 프로젝트 제외, 편성으로 미뤘던 런칭은 원래 목표로
  const base=ACT().filter(w=>!w.auto).map(w=>w.launchByPlan?{...w,launch:w.launch0||"2026-12-21"}:w);
  const items=base.map(w=>({w,lmin:lminOf(w),dur:serialDays(w)})).map(i=>({...i,L:i.lmin}));
  if(items.length<2) return {changes:[],added:[],removed:[],gaps:[],S0:null};
  const S0=[...items].sort((a,b)=>a.lmin-b.lmin)[1].lmin;
  const END=D(PLAN_END), today=monOnOrAfter(addDays(TODAY,1));
  let extN=WORKS.filter(w=>!w.auto&&/^외부 제작/.test(w.n)).length;
  const added=[], hard=[];
  for(let t=S0;t<=END;t=addDays(t,7)){
    let guard=0;
    while(onAirCount(items,t)<MIN_ON_AIR&&guard++<6){
      // ① 새 외부 프로젝트: t에 런칭하려면 늦어도 언제 착수해야 하는지 역산
      let s=null;
      for(let c=monOnOrAfter(addDays(t,-7*80)); c<=t; c=addDays(c,7)){
        const probe=newProject("ext",0,c,t); if(lminOf(probe)<=t) s=c; else break;
      }
      if(s&&s>=today){
        const w=newProject("ext",++extN,s,t); added.push(w);
        items.push({w,lmin:lminOf(w),dur:serialDays(w),L:t,isNew:true}); continue;
      }
      // ② 앞서 끝난 작품의 런칭을 미뤄서 공백 메우기 (앞 구간 조건은 계속 지켜야 함)
      let fixed=false;
      const cands=items.filter(i=>!i.isNew&&addDays(i.L,i.dur)<t).sort((a,b)=>addDays(b.L,b.dur)-addDays(a.L,a.dur));
      for(const i of cands){
        const old=i.L;
        for(let Lp=t;Lp>old;Lp=addDays(Lp,-7)){
          i.L=Lp;
          if(t<=addDays(Lp,i.dur)&&!coverageGaps(items,S0,addDays(t,-7)).length){fixed=true;break;}
        }
        if(fixed) break; i.L=old;
      }
      if(fixed) continue;
      hard.push({t,n:onAirCount(items,t)}); break;   // ③ 메울 방법 없음
    }
  }
  const changes=[];
  items.filter(i=>!i.isNew).forEach(i=>{
    const w=WORKS.find(x=>x.id===i.w.id), cur=schedule(w).L, shifted=key(i.L)!==key(i.lmin);
    if(key(i.L)!==key(cur)||(!!w.launchByPlan)!==shifted) changes.push({w,from:cur,to:i.L,shifted});
  });
  const removed=WORKS.filter(w=>w.auto);
  return {changes,added,removed,gaps:hard,S0,items};
}
function applyPlan(P){
  P.removed.forEach(w=>delWork(w.id));
  P.changes.forEach(c=>{
    const w=c.w;
    edit(w.id,c.shifted
      ?[{p:["launch"],v:key(c.to)},{p:["launchByPlan"],v:true},...(w.launchByPlan?[]:[{p:["launch0"],v:w.launch||"2026-12-21"}])]
      :[{p:["launch"],v:w.launch0||"2026-12-21"},{p:["launchByPlan"],del:true},{p:["launch0"],del:true}]);
  });
  P.added.forEach(w=>{
    w.pos=Math.max(0,...WORKS.map(x=>x.pos||0))+1; WORKS.push(w);
    if(SB.on){ (PENDING[w.id]=PENDING[w.id]||[]).push({p:["n"],v:w.n}); pushWork(w.id); }
  });
  render();
}
function coverageNow(){
  const items=ACT().map(w=>{const S=schedule(w);return {w,L:S.L,dur:serialDays(w),lmin:S.L};});
  if(items.length<2) return {S0:null,gaps:[]};
  const S0=[...items].sort((a,b)=>a.L-b.L)[1].L;
  return {S0,items,gaps:coverageGaps(items,S0,D(PLAN_END))};
}
const statusOf=(S)=>S.delayW>0?["bad",`목표 +${S.delayW}주`]:["good","목표대로"];

/* 런칭 시나리오 — 날짜를 정해 두고 휴재를 허용했을 때 운영 비교 (각 달 마지막 월요일) */
const SCENARIOS=[["2026-12-21","12/21 런칭"],["2027-01-25","1월 말 런칭 (1/25)"],["2027-02-22","2월 말 런칭 (2/22)"]];
let FORCE=null;   // null = 휴재 없는 일정, 아니면 시나리오 런칭일
const mi=(d)=>(d.getUTCFullYear()-Y0)*12+d.getUTCMonth();
/* 런칭일을 F로 고정했을 때: 최종본이 없는 주는 휴재, 준비되는 대로 다음 주 공개 */
function forced(S,F){
  const K=S.K; let L=F;
  while(S.eps.slice(1,K+1).some(e=>e.need>L)) L=addDays(L,7);
  const op=[null]; let hiatus=0, first=null, run=0, prev=null;
  for(let k=1;k<=S.N;k++){
    const need=S.eps[k].need, slot=k<=K?L:addDays(prev,CAD_D);
    let o=slot; while(need>o) o=addDays(o,7);
    const gap=k>K?weeks(slot,o):0;
    if(gap&&!first) first={k,slot};
    if(!first) run=k;
    hiatus+=gap; op.push({open:o,slot,gap}); prev=o;
  }
  return {L,ok:key(L)===key(F),op,hiatus,first,run,end:op[S.N].open};
}
function viewOf(S){
  if(FORCE) return forced(S,D(FORCE));
  return {L:S.L,ok:true,op:[null,...S.eps.slice(1).map(e=>({open:e.open,slot:e.open,gap:0}))],hiatus:0,first:null,run:S.N,end:S.end};
}

/* ---------- 편집 · 동기화 ----------
   편집은 '패치'로 보냅니다. 저장 직전에 서버의 최신 값을 받아 내 변경만 덮어쓰므로,
   같은 작품의 다른 칸을 두 사람이 동시에 고쳐도 서로 지워지지 않습니다.          */
function applyPatch(o,{p,v,del}){
  let x=o; for(let i=0;i<p.length-1;i++){ if(typeof x[p[i]]!=="object"||x[p[i]]===null) x[p[i]]={}; x=x[p[i]]; }
  if(del) delete x[p[p.length-1]]; else x[p[p.length-1]]=v;
}
const SB={on:!!(SUPABASE_URL&&SUPABASE_ANON_KEY)};
const PENDING={}, SEEN={}, TIMERS={};
let CONF_SEEN=null;
const hhmm=()=>new Date().toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"});
function setSync(s,t){const c=$("sync");c.dataset.s=s;c.textContent=t;}
async function sb(method,table,q="",body,prefer){
  const r=await fetch(`${SUPABASE_URL}/rest/v1/${table}${q}`,{method,cache:"no-store",
    headers:{apikey:SUPABASE_ANON_KEY,Authorization:`Bearer ${SUPABASE_ANON_KEY}`,"Content-Type":"application/json",...(prefer?{Prefer:prefer}:{})},
    body:body?JSON.stringify(body):undefined});
  if(!r.ok) throw new Error(`${r.status} ${await r.text()}`);
  const t=await r.text(); return t?JSON.parse(t):null;
}
function edit(id,patches){
  const w=WORKS.find(x=>x.id===id); if(!w) return;
  patches.forEach(p=>applyPatch(w,p));
  if(SB.on){ (PENDING[id]=PENDING[id]||[]).push(...patches); clearTimeout(TIMERS[id]); TIMERS[id]=setTimeout(()=>pushWork(id),500); setSync("busy","저장 대기…"); }
  render();
}
async function pushWork(id){
  const ps=PENDING[id]||[]; if(!ps.length) return; PENDING[id]=[];
  setSync("busy","저장 중…");
  try{
    const r=await sb("GET",T_WORKS,`?id=eq.${encodeURIComponent(id)}&select=data`);
    const local=WORKS.find(x=>x.id===id);
    const base=r&&r.length?normW(r[0].data):clone(local||{id});
    ps.forEach(p=>applyPatch(base,p));
    const now=new Date().toISOString();
    await sb("POST",T_WORKS,"",[{id,pos:base.pos||0,data:base,updated_at:now}],"resolution=merge-duplicates");
    SEEN[id]=now;
    const nb=clone(base); (PENDING[id]||[]).forEach(p=>applyPatch(nb,p));
    const i=WORKS.findIndex(x=>x.id===id); if(i>=0) WORKS[i]=nb;
    setSync("on",`공유 중 · ${hhmm()} 저장됨`); safeRender();
  }catch(e){
    PENDING[id]=ps.concat(PENDING[id]||[]);
    setSync("err","저장 실패 — 5초 뒤 다시 시도합니다"); clearTimeout(TIMERS[id]); TIMERS[id]=setTimeout(()=>pushWork(id),5000);
  }
}
async function saveConf(){
  render();
  if(!SB.on) return;
  setSync("busy","저장 중…");
  try{ const now=new Date().toISOString();
    await sb("POST",T_CONF,"",[{id:"default",data:CONF,updated_at:now}],"resolution=merge-duplicates");
    CONF_SEEN=now; setSync("on",`공유 중 · ${hhmm()} 저장됨`);
  }catch(e){ setSync("err","공정 기준 저장 실패 — 새로고침 후 다시 시도해 주세요"); }
}
function addWork(){
  const id="w"+Date.now().toString(36), pos=Math.max(0,...WORKS.map(w=>w.pos||0))+1;
  const w=normW({id,pos,n:"새 작품",start:key(snapBD(TODAY))});
  WORKS.push(w); SEL=id;
  if(SB.on){ (PENDING[id]=PENDING[id]||[]).push({p:["n"],v:w.n}); pushWork(id); }
  render();
}
async function delWork(id){
  WORKS=WORKS.filter(w=>w.id!==id); delete PENDING[id]; clearTimeout(TIMERS[id]);
  render();
  if(SB.on){ try{ await sb("DELETE",T_WORKS,`?id=eq.${encodeURIComponent(id)}`); setSync("on",`공유 중 · ${hhmm()} 삭제됨`);}
    catch(e){ setSync("err","삭제 실패 — 새로고침 후 다시 시도해 주세요"); } }
}
async function replaceAll(works,conf){
  WORKS=works; CONF=normConf(conf); setHol(CONF.hol);
  if(!SB.on) return;
  const now=new Date().toISOString();
  const cur=await sb("GET",T_WORKS,"?select=id");
  const keep=new Set(works.map(w=>w.id));
  for(const r of cur) if(!keep.has(r.id)) await sb("DELETE",T_WORKS,`?id=eq.${encodeURIComponent(r.id)}`);
  if(works.length) await sb("POST",T_WORKS,"",works.map(w=>({id:w.id,pos:w.pos||0,data:w,updated_at:now})),"resolution=merge-duplicates");
  await sb("POST",T_CONF,"",[{id:"default",data:CONF,updated_at:now}],"resolution=merge-duplicates");
  works.forEach(w=>SEEN[w.id]=now); CONF_SEEN=now;
}
async function pullAll(force){
  const rows=await sb("GET",T_WORKS,"?select=id,pos,data,updated_at&order=pos.asc");
  const cf=await sb("GET",T_CONF,"?id=eq.default&select=data,updated_at");
  let changed=false;
  const ids=new Set(rows.map(r=>r.id));
  rows.forEach(r=>{
    if(PENDING[r.id]&&PENDING[r.id].length) return;
    if(!force&&SEEN[r.id]===r.updated_at) return;
    SEEN[r.id]=r.updated_at;
    const w=normW({...r.data,id:r.id,pos:r.pos});
    const i=WORKS.findIndex(x=>x.id===r.id); if(i<0) WORKS.push(w); else WORKS[i]=w; changed=true;
  });
  const before=WORKS.length;
  WORKS=WORKS.filter(w=>ids.has(w.id)||(PENDING[w.id]&&PENDING[w.id].length));
  if(WORKS.length!==before) changed=true;
  WORKS.sort((a,b)=>(a.pos||0)-(b.pos||0));
  if(cf&&cf.length&&(force||cf[0].updated_at!==CONF_SEEN)){ CONF=normConf(cf[0].data); setHol(CONF.hol); CONF_SEEN=cf[0].updated_at; changed=true; }
  return {changed,empty:!rows.length&&!(cf&&cf.length)};
}

/* ---------- 탭 · 시작 ---------- */
function setTab(t){
  TAB=t; $("pop").hidden=true;
  render(); window.scrollTo(0,0);
  try{   // 미리보기·file:// 등 일부 환경은 주소 변경을 막으므로 실패해도 무시
    const u=new URL(location.href); u.searchParams.set("tab",t);
    if(t==="prod"&&SEL) u.searchParams.set("w",SEL); else u.searchParams.delete("w");
    history.replaceState(null,"",u.toString());
  }catch(e){}
}
document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>setTab(b.dataset.tab)));
(async function init(){
  try{ const q=new URLSearchParams(location.search);
    if(["open","prod","std"].includes(q.get("tab"))) TAB=q.get("tab");
    if(q.get("w")) SEL=q.get("w"); }catch(e){}
  if(!SB.on){
    WORKS=clone(DEFAULT_WORKS).map(normW);
    setSync("off","공유 저장소 미설정 — 고친 내용이 이 창에만 남습니다");
    runMigrations(); render(); return;
  }
  setSync("busy","공유 저장소 불러오는 중…"); render();
  try{
    const r=await pullAll(true);
    if(r.empty) await replaceAll(clone(DEFAULT_WORKS).map(normW),clone(DEFAULT_CONF));
    runMigrations();
    setSync("on",`공유 중 · ${hhmm()} 불러옴`);
  }catch(e){ if(!WORKS.length) WORKS=clone(DEFAULT_WORKS).map(normW); setSync("err","공유 저장소 연결 실패 — URL·키·테이블을 확인해 주세요"); }
  render();
  const tick=async()=>{ try{ const r=await pullAll(false); if(r.changed) safeRender(); if(!Object.values(PENDING).some(a=>a.length)) setSync("on",`공유 중 · ${hhmm()} 확인`);}catch(e){ setSync("err","공유 저장소 연결 끊김 — 다시 시도 중"); } };
  setInterval(tick,POLL_MS);
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden) tick(); });
})();
</script>
